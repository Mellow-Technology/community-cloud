# Main certificate issuer for Community Cloud.
#
# Every application's certificate comes from here: a ListenerSet on the
# cluster Gateway (cc-letsencrypt-web-gateway) carries the annotation
# "cert-manager.io/cluster-issuer: cc-lets-encrypt", and cert-manager
# asks Let's Encrypt for one per HTTPS listener. Applied by the
# cert-manager package, once its chart is in. Cluster-wide, so it has
# no namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cc-lets-encrypt
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  acme:
    email: {{ .Values.adminEmail }}
    profile: tlsserver
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: cc-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            podTemplate:
              spec:
                nodeSelector:
                  node-role.kubernetes.io/worker: worker

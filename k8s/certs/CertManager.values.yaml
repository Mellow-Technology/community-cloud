# Enable Gateway API support for cert manager.
#
# Needs cert-manager 1.21 or later. The nested "gatewayAPI" block
# below only exists from 1.21; 1.20 and earlier take a flat
# "enableGatewayAPI" instead and reject this one, failing to decode
# their own configuration and crashlooping with "unknown field
# gatewayAPI".
#
# ExperimentalGatewayAPISupport defaults on from 1.21, but ListenerSets
# is still alpha and off, so the feature gate below is required.
config:
  gatewayAPI:
    enabled: true
    enableListenerSet: true
  featureGates:
    ListenerSets: true

  # Where cert-manager looks a hostname up for its HTTP-01 self check,
  # the request it makes to the challenge URL itself before asking
  # Let's Encrypt to. Public resolvers rather than the cluster's DNS.
  #
  # A certificate is asked for the moment its ListenerSet exists,
  # which is usually before the hostname's DNS record does, so the
  # first lookup is told the name doesn't exist. Through the cluster's
  # DNS that answer is kept by the nodes' resolver for as long as the
  # zone says to keep a "no" — half an hour on DigitalOcean — and the
  # self check fails for all of it with "no such host", long after the
  # record is there. These resolvers keep a "no" too, if they were
  # asked before the record existed, so this narrows the problem
  # rather than ending it: it takes the nodes' resolver, and whatever
  # it was asked earlier, out of the way. Solving with DNS-01 instead
  # would end it.
  #
  # Only the self check: Let's Encrypt does its own lookups, and the
  # solver pod and everything else in the cluster still use the
  # cluster's DNS.
  acmeHTTP01Config:
    solverNameservers:
      - "1.1.1.1:53"
      - "8.8.8.8:53"

# Install the custom resources as part of the release.
#
# The chart leaves this off by default, and without it cert-manager
# installs and does nothing: there is no Certificate or Issuer kind
# for it to act on, and its own startup check spins until the Helm
# timeout waiting for CRDs that are never coming.
#
# "keep" means uninstalling the release leaves the CRDs behind. That
# is the safe default — removing them deletes every Certificate and
# Issuer in the cluster along with them.
crds:
  enabled: true
  keep: true

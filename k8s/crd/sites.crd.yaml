# Web application custom resource definition
# Used to create all the elements of a full-fledged
# running web application including handling the
# following:
#
# - Handling framework specific considerations
# - Setting up any database needs for the application
# - Orchestrating services the application needs
# - Run migrations, jobs, or other scripts to make the application function
# - Setup logging, tracing, etc.
#
# In short this is made to handle as much of the
# heavy lifting as possible so that everything
# "just works".
#
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.community-cloud.technology
spec:
  group: community-cloud.technology
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            type: object
            properties:
              # Used for the type of database
              # Currently support Postgresql
              databaseType:
                type: string
              # Image that will be used for the deployment
              webappImage:
                type: string
              # How many replicas should the deployment run
              webappReplicas:
                type: integer
  scope: Namespace
  names:
    plural: webapps
    singular: webapp
    kind: Webapp
    shortNames:
      - wa

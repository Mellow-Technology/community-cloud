# ProjectSend's client in Authentik.
#
# Not a Kubernetes manifest. This is an Authentik blueprint, which the
# installer hands to Authentik's worker once the client's credentials
# exist — see installer/src/cli/commands/Authentik.ts. It's rendered as
# a template first, like everything else in k8s/, and the client ID and
# secret arrive separately through "!Context" so they're never written
# into it.
#
# Every entry is found by its identifiers and made to match, so this
# can be applied as often as the install is run.
#
# Who may sign in is left to Authentik. ProjectSend makes a client
# account for anyone Authentik sends it who doesn't have one (see
# ProjectSend.provision.yaml), and with no policy bound to the
# application that's everyone with an Authentik account. Bind a group
# to it in Authentik to narrow that down; this blueprint won't undo it.
version: 1
metadata:
  name: Community Cloud - ProjectSend
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
entries:
  # ProjectSend won't let an address Authentik hasn't verified reach an
  # account that already exists, and Authentik's own mapping says no
  # address is verified. So the administrator, whose account is made
  # with the cluster's admin address, could never sign in through it.
  #
  # The same mapping as Documenso's, and the same caveat: saying
  # "verified" holds because an administrator makes the accounts in
  # this Authentik. If self service enrolment is ever switched on, this
  # has to change. Identical, so whichever is applied last changes
  # nothing.
  - model: authentik_providers_oauth2.scopemapping
    id: email-verified
    identifiers:
      name: "Community Cloud: email, as verified"
    attrs:
      scope_name: email
      description: "Email address"
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: ProjectSend
    attrs:
      client_type: confidential
      client_id: !Context client_id
      client_secret: !Context client_secret
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # ProjectSend sends people back here, and nowhere else
      redirect_uris:
        - matching_mode: strict
          url: {{ printf "https://%s/auth/oidc/callback" .Values.domain.files | quote }}
      # Authentik 2026 starts a new provider with no grant types, so
      # each one this client uses is named
      grant_types: [authorization_code]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf email-verified

  - model: authentik_core.application
    identifiers:
      slug: projectsend
    attrs:
      name: ProjectSend
      provider: !KeyOf provider
      meta_launch_url: {{ printf "https://%s/" .Values.domain.files | quote }}
      meta_description: File sharing with clients
      policy_engine_mode: any

# ProjectSend's configuration.
#
# Everything here is safe to read. The secrets — the database and Redis
# passwords, Laravel's application key, the first administrator's
# password, the sign in client's secret and the bucket's keys — are
# generated by the installer, or by the SeaweedFS operator, and handed
# to the containers from their own Secrets in ProjectSend.yaml.
#
# ProjectSend reads its own settings from its database, not from here.
# The two that have to be there before anyone signs in — signing in
# through Authentik, and where files go — are written on first start
# from the values at the bottom, by ProjectSend.provision.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: projectsend
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: {{ printf "https://%s" .Values.domain.files | quote }}

  # Everything reaches it through the cluster Gateway, so the address a
  # request came from, and that it was HTTPS, are in the headers the
  # Gateway adds. Without this ProjectSend builds http:// links, every
  # form fails as a stale page, and its sign in rate limit counts every
  # visitor as the Gateway. Only the Gateway, and pods in the cluster,
  # can reach the Service at all.
  TRUSTED_PROXIES: "*"

  # Its database is in the shared MariaDB, from ProjectSend.database.yaml
  DB_CONNECTION: "mariadb"
  DB_HOST: "cc-mariadb"
  DB_PORT: "3306"
  DB_DATABASE: "projectsend"

  # Sessions, the cache and the job queue, in the shared Redis. Two
  # databases of their own: Twenty has 0, Lago 1 and 2, Plane 3.
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "4"
  REDIS_CACHE_DB: "5"
  CACHE_STORE: "redis"
  SESSION_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"

  # To the pod's log rather than a file on the volume
  LOG_CHANNEL: "stderr"

  # The first administrator, made on first start with the cluster's
  # admin address, and ignored once anyone has an account
  ADMIN_NAME: "Administrator"
  ADMIN_EMAIL: {{ .Values.adminEmail | quote }}

  # The cluster's mail server, from "smtp" in the configuration, until
  # an administrator sets one in ProjectSend's own settings. Without
  # one, mail is written to the log rather than lost in a connection
  # that never succeeds.
{{ if .Values.mail.enabled }}
  MAIL_MAILER: "smtp"
  MAIL_SCHEME: {{ .Values.mail.scheme | quote }}
  MAIL_HOST: {{ .Values.mail.host | quote }}
  MAIL_PORT: {{ .Values.mail.port | quote }}
{{ else }}
  MAIL_MAILER: "log"
{{ end }}
  MAIL_FROM_ADDRESS: {{ printf "files@%s" .Values.mail.fromDomain | quote }}
  MAIL_FROM_NAME: "ProjectSend"

  # Read by ProjectSend.provision.yaml on first start, and on every
  # start after: Authentik's issuer for the projectsend application,
  # whose discovery document ProjectSend reads the rest from
  CC_OIDC_ISSUER: {{ printf "https://%s/application/o/projectsend" .Values.domain.auth | quote }}

  # And where files go. The bucket is reached on SeaweedFS's public
  # hostname rather than inside the cluster, because ProjectSend sends
  # a download to a link signed for the address it talks to, and that
  # link has to work in a browser. Addressed by path, and SeaweedFS
  # takes whatever region a request is signed for.
{{ if .Values.projectsend.s3 }}
  CC_STORAGE: "s3"
  CC_S3_ENDPOINT: {{ printf "https://%s" .Values.domain.storage | quote }}
  CC_S3_REGION: {{ .Values.objectStorage.region | quote }}
  CC_S3_BUCKET: "projectsend"
{{ else }}
  CC_STORAGE: "local"
{{ end }}

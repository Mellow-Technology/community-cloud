# We use a namespace for back office applications
# appropriately named cc-office. This allows policies
# to be set for back office applications.
apiVersion: v1
kind: Namespace
metadata:
  name: cc-office
  labels:
    # What the cluster Gateway's allowedListeners selects on, in
    # networking/cilium/gateway/Gateway.yaml. Without it a ListenerSet
    # here is refused and the applications have no way in.
    whereWereGoing: "weDontNeedRoads"
    app.kubernetes.io/managed-by: "community-cloud"

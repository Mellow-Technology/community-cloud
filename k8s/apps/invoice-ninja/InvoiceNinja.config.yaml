# Invoice Ninja's configuration, and the web server in front of it.
#
# Everything here is safe to read. The secrets — the database
# password, the application key, the first account's password and the
# Authentik client — are generated by the installer and handed to the
# container from their own Secrets in InvoiceNinja.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: invoice-ninja
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
data:
  APP_URL: {{ printf "https://%s" .Values.domain.invoicing | quote }}
  # Where the sign in callback sends people once Authentik is done
  # with them. The web app is served from the same place.
  REACT_URL: {{ printf "https://%s" .Values.domain.invoicing | quote }}
  APP_ENV: "production"
  APP_DEBUG: "false"
  IS_DOCKER: "true"

  # TLS ends at the Gateway, which says so in X-Forwarded-Proto. Every
  # address in the cluster is trusted to say it, since nothing reaches
  # the pod except through the Gateway.
  REQUIRE_HTTPS: "false"
  TRUSTED_PROXIES: "*"

  # PDFs are rendered by the Chrome inside the image
  PDF_GENERATOR: "snappdf"
  # The disk the Debian image is laid out for
  FILESYSTEM_DISK: "debian_docker"

  # The cluster's Redis isn't something any package installs yet, so
  # caching and sessions go to the volume and the queue to the
  # database. Fine for one replica; anything more wants Redis.
  CACHE_DRIVER: "file"
  SESSION_DRIVER: "file"
  QUEUE_CONNECTION: "database"

  DB_CONNECTION: "mysql"
  DB_HOST: "invoice-ninja-mariadb"
  DB_PORT: "3306"
  DB_DATABASE: "ninja"

  # The first account, made on first start. Signing in through
  # Authentik with this address — once Authentik says it's verified —
  # links the two, and from then on that's how it's used.
  IN_USER_EMAIL: {{ .Values.adminEmail | quote }}

  # Single sign on through Authentik. The client is registered by
  # InvoiceNinja.blueprint.yaml, whose application slug is the
  # "invoice-ninja" in this address. The button only appears when
  # OIDC_CLIENT_ID is set, which it is, from invoice-ninja-oidc.
  OIDC_WELL_KNOWN: {{ printf "https://%s/application/o/invoice-ninja/.well-known/openid-configuration" .Values.domain.auth | quote }}
  OIDC_PROVIDER_LABEL: "Community Cloud"
  OIDC_SCOPES: "openid profile email"

  # Mail goes through the cluster's mail server, from "smtp" in the
  # configuration, and to Invoice Ninja's log when there isn't one.
  # The username and password come from the cc-smtp Secret, in
  # InvoiceNinja.yaml. Symfony's mailer, which Laravel uses, takes
  # the kind of TLS as a scheme: smtps for TLS from the start, smtp
  # for upgrading to it when the server offers.
{{ if .Values.mail.enabled }}
  MAIL_MAILER: "smtp"
  MAIL_HOST: {{ .Values.mail.host | quote }}
  MAIL_PORT: {{ .Values.mail.port | quote }}
  MAIL_SCHEME: {{ .Values.mail.scheme | quote }}
{{ else }}
  MAIL_MAILER: "log"
{{ end }}
  MAIL_FROM_ADDRESS: {{ printf "invoices@%s" .Values.mail.fromDomain | quote }}
  MAIL_FROM_NAME: "Invoice Ninja"
---
# The image is PHP-FPM and nothing else. The project's own compose
# file runs nginx next to it sharing the public directory, and so does
# this, as a second container in the same pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: invoice-ninja-nginx
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
data:
  default.conf: |
    # From the Invoice Ninja image's own laravel.conf, with PHP-FPM
    # reached over localhost rather than another container's name
    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;
        charset utf-8;

        # Logos, documents and imported files. Matches what the image
        # lets PHP accept.
        client_max_body_size 100M;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            # Generating a PDF on a slow node takes longer than nginx
            # waits by default
            fastcgi_read_timeout 300;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }

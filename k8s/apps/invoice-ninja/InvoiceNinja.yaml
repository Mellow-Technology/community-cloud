# Invoice Ninja
#
# One pod, two containers. The image runs PHP-FPM, two queue workers
# and the scheduler under supervisord, and expects a web server beside
# it to serve the public directory and hand PHP requests over. That's
# nginx here, in the same pod, so the two share the public directory
# and the storage volume and talk over localhost.
#
# One replica, and replaced rather than rolled: the storage volume can
# only be mounted on one node at a time, and two copies would both run
# the scheduler and send every recurring invoice twice.
apiVersion: v1
kind: Service
metadata:
  name: invoice-ninja
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  selector:
    app: invoice-ninja
    role: server
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-ninja
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: invoice-ninja
      role: server
  template:
    metadata:
      labels:
        app: invoice-ninja
        role: server
        app.kubernetes.io/managed-by: "community-cloud"
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      containers:
        - name: invoice-ninja
          # 5.13.38 is the first release with generic OIDC sign in,
          # which is what makes Authentik work without a proxy in front
          image: invoiceninja/invoiceninja-debian:5.13.49
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: invoice-ninja
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: invoice-ninja-app-key
                  key: password
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: invoice-ninja-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoice-ninja-db
                  key: password
            # Only read on the very first start, to make the first
            # account. After that it's in the database, and this is
            # where to find what it was set to.
            - name: IN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoice-ninja-admin
                  key: password
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: invoice-ninja-oidc
                  key: username
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: invoice-ninja-oidc
                  key: password
          ports:
            - name: fastcgi
              containerPort: 9000
          # The image migrates and, the first time, seeds the database
          # before supervisord starts PHP-FPM, so the port opening is
          # the sign it's done. That can take several minutes, which
          # is what the startup probe's patience is for.
          startupProbe:
            tcpSocket:
              port: fastcgi
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            tcpSocket:
              port: fastcgi
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: 500m
          volumeMounts:
            - name: public
              mountPath: /var/www/html/public
            - name: storage
              mountPath: /var/www/html/storage
        - name: nginx
          image: nginx:1.30-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # Through nginx and PHP to Laravel and the database, so ready
          # means the whole chain answers
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: 50m
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: public
              mountPath: /var/www/html/public
              readOnly: true
            # public/storage is a link into here, for logos and
            # documents served directly
            - name: storage
              mountPath: /var/www/html/storage
              readOnly: true
      volumes:
        # Filled from the image every time the pod starts, which is the
        # image's own way of keeping it in step with the version
        # running, so there's nothing in it worth keeping
        - name: public
          emptyDir: {}
        - name: storage
          persistentVolumeClaim:
            claimName: invoice-ninja-storage
        - name: nginx-config
          configMap:
            name: invoice-ninja-nginx

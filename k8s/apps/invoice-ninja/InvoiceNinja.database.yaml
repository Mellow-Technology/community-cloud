# MariaDB for Invoice Ninja
#
# The one database in the cluster that isn't CloudNativePG. Invoice
# Ninja supports MySQL and MariaDB and nothing else — its migrations
# are written for them — so it can't share cc-postgres with everything
# else, and it gets a MariaDB of its own instead.
#
# One instance, like cc-postgres in YOLO mode. There's no operator
# here to run a replicated one, so backing it up is a mysqldump away
# rather than a CloudNativePG backup.
#
# The credentials are made by the installer: invoice-ninja-db for the
# account Invoice Ninja connects as, and invoice-ninja-db-root for
# root. The image only reads them the first time it starts on an empty
# volume, so changing either Secret afterwards changes nothing in the
# database.
apiVersion: v1
kind: Service
metadata:
  name: invoice-ninja-mariadb
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  # Headless, which is what a StatefulSet's own name resolves through
  clusterIP: None
  selector:
    app: invoice-ninja
    role: database
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: invoice-ninja-mariadb
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  serviceName: invoice-ninja-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: invoice-ninja
      role: database
  template:
    metadata:
      labels:
        app: invoice-ninja
        role: database
        app.kubernetes.io/managed-by: "community-cloud"
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      containers:
        - name: mariadb
          # The current long term support release. Invoice Ninja is
          # tested against MySQL 8 and MariaDB both.
          image: mariadb:11.8
          imagePullPolicy: IfNotPresent
          env:
            # Has to match DB_DATABASE in InvoiceNinja.config.yaml
            - name: MARIADB_DATABASE
              value: ninja
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: invoice-ninja-db
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoice-ninja-db
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoice-ninja-db-root
                  key: password
          ports:
            - name: mysql
              containerPort: 3306
          # The image's own health check. "--innodb_initialized" waits
          # out the first start, when the server is up but still
          # making its system tables.
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: 250m
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # Generally speaking for databases we use fast SSDs
        storageClassName: cc-local-ssd-fast
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

# Invoice Ninja's client in Authentik.
#
# Not a Kubernetes manifest. This is an Authentik blueprint, which the
# installer hands to Authentik's worker once the client's credentials
# exist — see installer/src/cli/commands/Authentik.ts. It's rendered as
# a template first, like everything else in k8s/, and the client ID and
# secret arrive separately through "!Context" so they're never written
# into it.
#
# Every entry is found by its identifiers and made to match, so this
# can be applied as often as the install is run. A change made to the
# provider in Authentik's own pages lasts until the next install.
#
# Who may sign in is left to Authentik: with no policy bound to the
# application, anyone with an Authentik account can — and Invoice Ninja
# then lets in only those it already has an account for.
version: 1
metadata:
  name: Community Cloud - Invoice Ninja
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
entries:
  # Authentik's own email mapping says every address is unverified,
  # and Invoice Ninja will only link a sign in to an existing account
  # by address when it's told the address is verified. Without this,
  # nobody could ever sign in through Authentik.
  #
  # Saying "verified" is a statement about how accounts get into this
  # Authentik: an administrator makes them, so the address on one is
  # the one they gave. If self service enrolment is ever switched on,
  # this has to change, or anyone could register someone else's
  # address and be signed in as them.
  - model: authentik_providers_oauth2.scopemapping
    id: email-verified
    identifiers:
      name: "Community Cloud: email, as verified"
    attrs:
      scope_name: email
      description: "Email address"
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Invoice Ninja
    attrs:
      client_type: confidential
      client_id: !Context client_id
      client_secret: !Context client_secret
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Invoice Ninja sends people back here, and nowhere else
      redirect_uris:
        - matching_mode: strict
          url: {{ printf "https://%s/auth/oidc" .Values.domain.invoicing | quote }}
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf email-verified

  - model: authentik_core.application
    identifiers:
      slug: invoice-ninja
    attrs:
      name: Invoice Ninja
      provider: !KeyOf provider
      meta_launch_url: {{ printf "https://%s/" .Values.domain.invoicing | quote }}
      meta_description: Invoicing, quotes and payments
      policy_engine_mode: any

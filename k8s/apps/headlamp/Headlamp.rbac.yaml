# Who administers the cluster, signed in through Authentik.
#
# The members of one Authentik group — "k8s-admins" unless
# values.clusterAdminGroup says otherwise — are cluster admins. The
# API server knows them by their Authentik groups with "authentik:" in
# front, and only lets in members of a group starting "k8s-"; see
# installer/src/cli/commands/ClusterSignIn.ts.
#
# Anyone else in a "k8s-" group is let in and can see nothing until
# something is bound to them. Bind a narrower role to their group,
# "authentik:k8s-<name>", for people who should look but not touch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cc-authentik-cluster-admins
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ printf "authentik:%s" .Values.clusterAdminGroup | quote }}

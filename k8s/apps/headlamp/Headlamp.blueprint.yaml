# Headlamp's client in Authentik.
#
# Not a Kubernetes manifest. This is an Authentik blueprint, which the
# installer hands to Authentik's worker once the client's credentials
# exist — see installer/src/cli/commands/Authentik.ts. The client ID
# and secret arrive through "!Context". The ID is always "headlamp":
# the Kubernetes API server is told it when K3s is installed, and only
# accepts tokens issued to it (see ClusterSignIn.ts).
#
# Headlamp passes the token it gets here straight on to the API server,
# which takes the person's Authentik username as their name and their
# Authentik groups as their groups, both from the "profile" scope. So
# the signing key has to be one the API server can check from
# Authentik's published keys — the self-signed certificate, rather than
# the client secret.
#
# Who may sign in is left to Authentik and to the API server, which
# only lets in members of a "k8s-" group; what they may do once in is
# RBAC, in Headlamp.rbac.yaml.
version: 1
metadata:
  name: Community Cloud - Headlamp
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Headlamp
    attrs:
      client_type: confidential
      client_id: !Context client_id
      client_secret: !Context client_secret
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Asymmetric, so the API server can check a token without the
      # client secret
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # The issuer is the application's own address, which is what the
      # API server is told to expect
      issuer_mode: per_provider
      # Headlamp sends people back here, and nowhere else
      redirect_uris:
        - matching_mode: strict
          url: {{ printf "https://%s/oidc-callback" .Values.domain.headlamp | quote }}
      # "profile" is Authentik's own, and carries the username and the
      # groups
      # Authentik 2026 starts a new provider with no grant types, so
      # each one this client uses is named
      grant_types: [authorization_code]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: headlamp
    attrs:
      name: Headlamp
      provider: !KeyOf provider
      meta_launch_url: {{ printf "https://%s/" .Values.domain.headlamp | quote }}
      meta_description: The cluster, in a browser
      policy_engine_mode: any

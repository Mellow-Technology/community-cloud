# Meteorologist: Community Cloud's web interface. See ui/meteorologist.
#
# People sign in through Authentik, and every request to the Kubernetes
# API is made with that person's own ID token, so what they can do here
# is what RBAC already lets them do anywhere else. The pod is given the
# API server's address and the CA to check it with, from the
# kube-root-ca.crt ConfigMap every namespace has.
#
# Its own access is two things. Listing namespaces: Kubernetes can't say
# which namespaces someone has access to, so people who can't list them
# have their access tried against this list, as themselves, and only
# see the ones that answer. See "Limited access" in
# ui/meteorologist/README.md, which also says why this may not last.
# And getting one ConfigMap by name, meteorologist-gitlab-builds, in any
# namespace: GitLab fetches a project's CI build from Meteorologist
# without signing in, so that's read with no one to read it as. It holds
# Dockerfile paths and the key the build's URL carries, nothing more.
# See "GitLab CI builds" in the README.
# The usual token isn't mounted; the one for this is in its own
# volume, and only those reads use it.
#
# Its sign in is the "meteorologist" client in Authentik
# (Meteorologist.blueprint.yaml), which the API server trusts once the
# k3s or cluster-sign-in bundle has run with this package enabled (see
# installer/src/cli/commands/ClusterSignIn.ts).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meteorologist
  namespace: community-cloud
  labels:
    app.kubernetes.io/name: meteorologist
    app.kubernetes.io/managed-by: "community-cloud"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meteorologist-namespace-lister
  labels:
    app.kubernetes.io/name: meteorologist
    app.kubernetes.io/managed-by: "community-cloud"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meteorologist-namespace-lister
  labels:
    app.kubernetes.io/name: meteorologist
    app.kubernetes.io/managed-by: "community-cloud"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meteorologist-namespace-lister
subjects:
  - kind: ServiceAccount
    name: meteorologist
    namespace: community-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meteorologist-gitlab-builds-reader
  labels:
    app.kubernetes.io/name: meteorologist
    app.kubernetes.io/managed-by: "community-cloud"
rules:
  # By name only: get, never list or watch, so no other ConfigMap
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["meteorologist-gitlab-builds"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meteorologist-gitlab-builds-reader
  labels:
    app.kubernetes.io/name: meteorologist
    app.kubernetes.io/managed-by: "community-cloud"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meteorologist-gitlab-builds-reader
subjects:
  - kind: ServiceAccount
    name: meteorologist
    namespace: community-cloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meteorologist
  namespace: community-cloud
  labels:
    app.kubernetes.io/name: meteorologist
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meteorologist
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meteorologist
    spec:
      serviceAccountName: meteorologist
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's "node" user. By name, the kubelet couldn't tell
        # it isn't root and would refuse to start the pod.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: meteorologist
          # Pinned, and released from a meteorologist-v<version> tag;
          # see .github/workflows/meteorologist.yml and
          # scripts/release/meteorologist.ts, which sets this
          image: ghcr.io/mellow-technology/meteorologist:0.15.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: METEOROLOGIST_KUBE_MODE
              value: user
            - name: METEOROLOGIST_URL
              value: {{ printf "https://%s" .Values.domain.meteorologist | quote }}
            - name: OIDC_ISSUER
              value: {{ printf "https://%s/application/o/meteorologist/" .Values.domain.auth | quote }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: meteorologist-oidc
                  key: username
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: meteorologist-oidc
                  key: password
            # What session cookies are sealed with. Made once, so
            # restarting Meteorologist doesn't sign everyone out.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: meteorologist-session
                  key: password
            # The in-cluster address, with the CA mounted below in place
            # of the ServiceAccount's
            - name: KUBE_API_SERVER
              value: https://kubernetes.default.svc
            - name: KUBE_CA_FILE
              value: /etc/meteorologist/kube-ca/ca.crt
            - name: METEOROLOGIST_NAMESPACE_LISTER_TOKEN_FILE
              value: /etc/meteorologist/namespace-lister/token
          volumeMounts:
            - name: kube-ca
              mountPath: /etc/meteorologist/kube-ca
              readOnly: true
            - name: namespace-lister
              mountPath: /etc/meteorologist/namespace-lister
              readOnly: true
            # Next writes its image cache here, and the rest of the
            # filesystem is read only
            - name: cache
              mountPath: /app/.next/cache
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: kube-ca
          configMap:
            name: kube-root-ca.crt
        - name: namespace-lister
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: meteorologist
  namespace: community-cloud
  labels:
    app.kubernetes.io/name: meteorologist
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  selector:
    app.kubernetes.io/name: meteorologist
  ports:
    - name: http
      port: 80
      targetPort: http

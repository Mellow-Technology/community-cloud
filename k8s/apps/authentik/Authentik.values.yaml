# Authentik's Helm values.
#
# Authentik is the identity provider the office applications, and
# people using the cluster itself, sign in through. Installed by the
# authentik package, from the chart at
# https://charts.goauthentik.io, with these values rendered against
# the configuration. Its database is in cc-postgres and its files in a
# bucket in SeaweedFS, from Authentik.database.yaml and
# Authentik.storage.yaml; it's reached through the cluster Gateway,
# from Authentik.network.yaml.
#
# https://docs.goauthentik.io/install-config/install/kubernetes/

authentik:
  # TODO: More templated values here
  secret_key: {{ .Values.authentik.secretKey | quote }}
  # Password resets, invitations and notifications go through the
  # cluster's mail server, from "smtp" in the configuration. The
  # username and password come from the cc-smtp Secret, below, rather
  # than being written into these values.
  email:
    from: {{ printf "auth@%s" .Values.mail.fromDomain | quote }}
{{ if .Values.mail.enabled }}
    host: {{ .Values.mail.host | quote }}
    port: {{ .Values.mail.port }}
    use_tls: {{ .Values.mail.startTls }}
    use_ssl: {{ .Values.mail.implicitTls }}
{{ end }}
  # Community Cloud aims for max privacy by default
  # In most cases like this we will default to not
  # reporting
  error_reporting:
    enabled: false
  # We're using CNPG so we disable the chart's
  # built in Postgres
  postgresql:
    name: authentik
    host: cc-postgres-rw
    user: file:///postgres-creds/username
    password: file:///postgres-creds/password
postgresql:
  enabled: false
server:
  volumes:
    - name: postgres-creds
      secret:
        secretName: authentik-db
  volumeMounts:
    - name: postgres-creds
      mountPath: /postgres-creds
      readOnly: true
  # Routed by Authentik.network.yaml instead
  route:
    main:
      enabled: false
worker:
  volumes:
    - name: postgres-creds
      secret:
        secretName: authentik-db
  volumeMounts:
    - name: postgres-creds
      mountPath: /postgres-creds
      readOnly: true
global:
  # Need to make sure this is noted to be
  # run by Community Cloud
  podLabels:
    app.kubernetes.io/managed-by: "community-cloud"
  # As per all things in Community Cloud
  # We run everything on worker nodes
  nodeSelector:
    node-role.kubernetes.io/worker: worker
  env:
    # Optional, so a cluster without a mail server, and so without the
    # Secret, still starts
    - name: AUTHENTIK_EMAIL__USERNAME
      valueFrom:
        secretKeyRef:
          name: cc-smtp
          key: username
          optional: true
    - name: AUTHENTIK_EMAIL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: cc-smtp
          key: password
          optional: true
    # TODO: Support read-replicas. Keep things
    # available.
    # https://docs.goauthentik.io/install-config/configuration/#read-replicas

    # Its files are in its own bucket in the cluster's SeaweedFS, from
    # Authentik.storage.yaml, reached inside the cluster and addressed
    # by path.
    - name: AUTHENTIK_STORAGE__BACKEND
      value: "s3"
    - name: AUTHENTIK_STORAGE__S3__ENDPOINT
      value: {{ .Values.objectStorage.endpoint | quote }}
    - name: AUTHENTIK_STORAGE__S3__REGION
      value: {{ .Values.objectStorage.region | quote }}
    - name: AUTHENTIK_STORAGE__S3__ADDRESSING_STYLE
      value: "path"
    - name: AUTHENTIK_STORAGE__S3__BUCKET_NAME
      value: "authentik"
    # Browsers fetch icons and backgrounds straight from S3. SeaweedFS's
    # own address is inside the cluster, so the links are for the
    # public one, with the bucket in the path. Links on a custom domain
    # aren't signed, so the bucket allows anonymous reads; see
    # Authentik.storage.yaml.
    - name: AUTHENTIK_STORAGE__S3__CUSTOM_DOMAIN
      value: {{ printf "%s/authentik" .Values.domain.storage | quote }}
    - name: AUTHENTIK_STORAGE__S3__SECURE_URLS
      value: "true"
    - name: AUTHENTIK_STORAGE__S3__ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-s3
          key: accessKey
    - name: AUTHENTIK_STORAGE__S3__SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-s3
          key: secretKey

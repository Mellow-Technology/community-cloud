# Authentik's bucket in the cluster's SeaweedFS, for application and
# source icons, flow backgrounds and reports, and keys to it and
# nothing else.
#
# Requests the SeaweedFS operator carries out, as for Lago: the bucket,
# an S3 user called "authentik", and a key pair for it, written into
# the Secret "authentik-s3" here. See k8s/storage/README.md.
#
# The bucket stays if this is ever removed — "Retain" is the operator's
# default. The user and its keys go.
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: authentik
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: authentik
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs
  identityRef:
    name: authentik
  # Made and owned by the operator, with the keys under "accessKey"
  # and "secretKey"
  secretRef:
    name: authentik-s3
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: authentik
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  clusterRef:
    name: seaweed
    namespace: seaweedfs
  # Capped, as the claim it replaces was
  quota:
    size: 20Gi
  # Authentik lists, reads, writes and deletes, which is all its own
  # documentation asks for
  access:
    - user: authentik
      actions: [Read, Write, List]
  # Browsers fetch icons, logos and backgrounds straight from here by
  # URL, with no keys: Authentik doesn't sign links on a custom domain
  # (see AUTHENTIK_STORAGE__S3__CUSTOM_DOMAIN in Authentik.values.yaml).
  # Reading an object whose name is known is all this allows; nobody
  # without keys can list what's in the bucket.
  anonymousRead: true

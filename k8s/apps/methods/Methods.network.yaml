# How Methods is reached: a ListenerSet on the cluster Gateway, as for
# the other applications, on values.domain.methods.
#
# The certificate is cert-manager's, asked for by the annotation:
# cert-manager makes one for the HTTPS listener and answers the
# HTTP-01 challenge through the HTTP one.
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: methods
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
  annotations:
    cert-manager.io/cluster-issuer: cc-lets-encrypt
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: cc-letsencrypt-web-gateway
    namespace: community-cloud
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: {{ .Values.domain.methods }}
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ .Values.domain.methods }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: methods-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: methods
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: methods
      sectionName: https
  hostnames:
    - {{ .Values.domain.methods }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: methods
          port: 8080
      # Each browser holds its workspace's live updates open as one long
      # request, and attachments of up to 25MB go up and come down
      # through Methods. Envoy otherwise ends a request that hasn't
      # finished in 15 seconds; zero turns the limit off.
      timeouts:
        request: 0s
---
# Plain HTTP is only ever sent to HTTPS. The ACME challenge cert-manager
# attaches to the same listener is more specific, so it still answers.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: methods-redirect
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: methods
      sectionName: http
  hostnames:
    - {{ .Values.domain.methods }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

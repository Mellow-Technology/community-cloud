# The Mattermost operator's Helm values.
#
# Installed by the "mattermost" package, into cc-office beside the
# installation it runs, from the chart at https://helm.mattermost.com.
# The installation itself is Mattermost.yaml.
mattermostOperator:
  enabled: true
  # One is plenty for the one installation
  replicas: 1
  rbac:
    create: true
  serviceAccount:
    create: true
  env:
    maxReconcilingInstallations: 20
    maxReconcilingConcurrency: 10
    requeuOnLimitDelay: 20s
  image:
    repository: mattermost/mattermost-operator
    tag: v1.25.4
    pullPolicy: IfNotPresent
  args:
    - --enable-leader-election
    - --metrics-addr=0.0.0.0:8383

  ## Specify image pull secret for private repository
  #
  # privateRegistry:
  #   enabled: false
  #   imagePullSecret: <name of the secret>

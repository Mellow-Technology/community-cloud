# Mattermost's database in cc-postgres. Its role, "mattermost", is one
# of those in Office.roles.yaml, made with CloudNativePG.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mattermost
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  name: mattermost
  owner: mattermost
  cluster:
    name: cc-postgres

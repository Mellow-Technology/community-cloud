# Documenso's configuration.
#
# Everything here is safe to read. The secrets — the database
# password, the session and encryption keys, the Authentik client and
# the signing certificate — are generated by the installer and handed
# to the container from their own Secrets in Documenso.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: documenso
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
data:
  PORT: "3000"
  NEXT_PUBLIC_WEBAPP_URL: {{ printf "https://%s" .Values.domain.signing | quote }}
  # How it calls itself for background jobs. Inside the pod, rather
  # than out through the Gateway and back.
  NEXT_PRIVATE_INTERNAL_WEBAPP_URL: "http://localhost:3000"

  # Uploads in the database, and background jobs run from it too, so
  # Postgres is the only thing Documenso needs
  NEXT_PUBLIC_UPLOAD_TRANSPORT: "database"
  NEXT_PRIVATE_JOBS_PROVIDER: "local"

  # Single sign on through Authentik, through the client
  # Documenso.blueprint.yaml registers — its slug is the "documenso"
  # in this address
  NEXT_PRIVATE_OIDC_WELL_KNOWN: {{ printf "https://%s/application/o/documenso/.well-known/openid-configuration" .Values.domain.auth | quote }}
  NEXT_PRIVATE_OIDC_PROVIDER_LABEL: "Community Cloud"
  # Documenso asks Authentik to make people sign in again every time
  # unless told otherwise. Empty leaves the prompt out, so someone
  # already signed in to Authentik goes straight through, which is the
  # point of single sign on.
  NEXT_PRIVATE_OIDC_PROMPT: ""

  # Authentik is the only way in. With passwords off, OpenID Connect
  # is the only way left, and Documenso's sign in page goes straight
  # to Authentik. An account is made the first time someone signs in
  # there, so who may use Documenso is whoever Authentik lets through.
  # Signers don't need any of this: they open documents through the
  # links they're sent, without an account.
  NEXT_PUBLIC_DISABLE_EMAIL_PASSWORD_SIGNUP: "true"
  NEXT_PUBLIC_DISABLE_EMAIL_PASSWORD_SIGNIN: "true"

  # Signed with the certificate the installer made, mounted as a file
  NEXT_PRIVATE_SIGNING_TRANSPORT: "local"
  NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: "/opt/documenso/cert.p12"

  # Documenso sends signing requests and receipts by email, and has
  # no settings page for mail: it's configured here or not at all. A
  # cluster has no mail server of its own, so until one is set here
  # nothing is sent, and documents are shared by copying their
  # signing links instead. The sender has to be set regardless.
  NEXT_PRIVATE_SMTP_TRANSPORT: "smtp-auth"
  NEXT_PRIVATE_SMTP_FROM_ADDRESS: {{ printf "documents@%s" .Values.domain.main | quote }}
  NEXT_PRIVATE_SMTP_FROM_NAME: "Documenso"

  # Community Cloud aims for privacy by default
  DOCUMENSO_DISABLE_TELEMETRY: "true"

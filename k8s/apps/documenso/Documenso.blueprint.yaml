# Documenso's client in Authentik.
#
# Not a Kubernetes manifest. This is an Authentik blueprint, which the
# installer hands to Authentik's worker once the client's credentials
# exist — see installer/src/cli/commands/Authentik.ts. It's rendered as
# a template first, like everything else in k8s/, and the client ID and
# secret arrive separately through "!Context" so they're never written
# into it.
#
# Every entry is found by its identifiers and made to match, so this
# can be applied as often as the install is run.
#
# Who may sign in is left to Authentik, and it matters more here than
# for Invoice Ninja: Documenso makes an account for anyone Authentik
# sends it. With no policy bound to the application, that's everyone
# with an Authentik account. Bind a group to it in Authentik to narrow
# that down; this blueprint won't undo it.
version: 1
metadata:
  name: Community Cloud - Documenso
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
entries:
  # The same mapping InvoiceNinja.blueprint.yaml declares, and for the
  # same reason: Documenso refuses a sign in whose address isn't
  # verified, and Authentik's own mapping calls every address that.
  # Declared in both so either can be installed alone; identical, so
  # whichever is applied last changes nothing. Why "verified" is safe
  # only while administrators make the accounts is explained there.
  - model: authentik_providers_oauth2.scopemapping
    id: email-verified
    identifiers:
      name: "Community Cloud: email, as verified"
    attrs:
      scope_name: email
      description: "Email address"
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Documenso
    attrs:
      client_type: confidential
      client_id: !Context client_id
      client_secret: !Context client_secret
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Documenso sends people back here, and nowhere else
      redirect_uris:
        - matching_mode: strict
          url: {{ printf "https://%s/api/auth/callback/oidc" .Values.domain.signing | quote }}
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf email-verified

  - model: authentik_core.application
    identifiers:
      slug: documenso
    attrs:
      name: Documenso
      provider: !KeyOf provider
      meta_launch_url: {{ printf "https://%s/" .Values.domain.signing | quote }}
      meta_description: Document signing
      policy_engine_mode: any

# Plane's bucket in the cluster's SeaweedFS, for attachments, images,
# avatars and exports, and keys to it and nothing else.
#
# Requests the SeaweedFS operator carries out, as for Lago: the bucket,
# an S3 user called "plane", and a key pair for it, written into the
# Secret "plane-s3" here. See k8s/storage/README.md.
#
# The bucket is called "uploads" whatever the resource is called:
# Plane's exports take that name out of their links, and break under
# any other. Browsers reach it on Plane's own hostname, at /uploads,
# which Plane.network.yaml sends to SeaweedFS.
#
# The bucket stays if this is ever removed — "Retain" is the operator's
# default. The user and its keys go.
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: plane
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: plane
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs
  identityRef:
    name: plane
  # Made and owned by the operator, with the keys under "accessKey"
  # and "secretKey"
  secretRef:
    name: plane-s3
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: plane-uploads
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  name: uploads
  clusterRef:
    name: seaweed
    namespace: seaweedfs
  quota:
    size: 20Gi
  access:
    - user: plane
      actions: [Read, Write, List, Tagging]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-api
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: plane
      role: api
  template:
    metadata:
      labels:
        app: plane
        role: api
        app.kubernetes.io/managed-by: "community-cloud"
      annotations:
        # Changes when the mail server does, so the pod is replaced and
        # starts with the new one
        community-cloud/smtp: {{ .Values.mail.revision | quote }}
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      initContainers:
        # Its migrations, so nothing starts against a database it
        # doesn't match. The worker and the scheduler wait for these
        # themselves, as their own entrypoints do.
        - name: migrate
          image: artifacts.plane.so/makeplane/plane-backend:v1.4.2
          imagePullPolicy: IfNotPresent
          command: ["./bin/docker-entrypoint-migrator.sh"]
          envFrom:
            - configMapRef:
                name: plane
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: plane-db
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: plane-db
                  key: password
            # The generated passwords are words and hyphens, and the
            # queue's are URL safe base64, so they go into URLs as they are
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@cc-postgres-rw:5432/plane"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-redis
                  key: password
            # A database of the shared Redis of its own
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/3"
            - name: MQ_USER
              valueFrom:
                secretKeyRef:
                  name: plane-user-credentials
                  key: username
            - name: MQ_PASS
              valueFrom:
                secretKeyRef:
                  name: plane-user-credentials
                  key: password
            - name: AMQP_URL
              value: "amqp://$(MQ_USER):$(MQ_PASS)@rabbitmq:5672/plane"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secret-key
                  key: password
            - name: LIVE_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-live-secret-key
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: plane-s3
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-s3
                  key: secretKey
            # Optional, so a cluster without a mail server, and so
            # without the Secret, still starts
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: cc-smtp
                  key: username
                  optional: true
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-smtp
                  key: password
                  optional: true
        # Its instance, then its first administrator; see
        # Plane.config.yaml for why the install makes one
        - name: claim
          image: artifacts.plane.so/makeplane/plane-backend:v1.4.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              python manage.py register_instance "$(hostname | sha256sum | cut -d ' ' -f 1)"
              python manage.py shell < /claim/claim.py
          envFrom:
            - configMapRef:
                name: plane
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: plane-db
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: plane-db
                  key: password
            # The generated passwords are words and hyphens, and the
            # queue's are URL safe base64, so they go into URLs as they are
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@cc-postgres-rw:5432/plane"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-redis
                  key: password
            # A database of the shared Redis of its own
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/3"
            - name: MQ_USER
              valueFrom:
                secretKeyRef:
                  name: plane-user-credentials
                  key: username
            - name: MQ_PASS
              valueFrom:
                secretKeyRef:
                  name: plane-user-credentials
                  key: password
            - name: AMQP_URL
              value: "amqp://$(MQ_USER):$(MQ_PASS)@rabbitmq:5672/plane"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secret-key
                  key: password
            - name: LIVE_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-live-secret-key
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: plane-s3
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-s3
                  key: secretKey
            # Optional, so a cluster without a mail server, and so
            # without the Secret, still starts
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: cc-smtp
                  key: username
                  optional: true
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-smtp
                  key: password
                  optional: true
            - name: PLANE_ADMIN_EMAIL
              value: {{ .Values.adminEmail | quote }}
            # Only read when the administrator is made. After that it's
            # in the database, and this is where to find what it was
            # set to.
            - name: PLANE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-admin
                  key: password
            - name: PLANE_INSTANCE_NAME
              value: "Community Cloud"
          volumeMounts:
            - name: claim
              mountPath: /claim
              readOnly: true
      containers:
        - name: api
          image: artifacts.plane.so/makeplane/plane-backend:v1.4.2
          imagePullPolicy: IfNotPresent
          command: ["./bin/docker-entrypoint-api.sh"]
          envFrom:
            - configMapRef:
                name: plane
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: plane-db
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: plane-db
                  key: password
            # The generated passwords are words and hyphens, and the
            # queue's are URL safe base64, so they go into URLs as they are
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@cc-postgres-rw:5432/plane"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-redis
                  key: password
            # A database of the shared Redis of its own
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/3"
            - name: MQ_USER
              valueFrom:
                secretKeyRef:
                  name: plane-user-credentials
                  key: username
            - name: MQ_PASS
              valueFrom:
                secretKeyRef:
                  name: plane-user-credentials
                  key: password
            - name: AMQP_URL
              value: "amqp://$(MQ_USER):$(MQ_PASS)@rabbitmq:5672/plane"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-secret-key
                  key: password
            - name: LIVE_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-live-secret-key
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: plane-s3
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-s3
                  key: secretKey
            # Optional, so a cluster without a mail server, and so
            # without the Secret, still starts
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: cc-smtp
                  key: username
                  optional: true
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-smtp
                  key: password
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          # Its entrypoint registers and configures the instance before
          # it listens
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: 250m
      volumes:
        - name: claim
          configMap:
            name: plane-claim
---

# Plane
#
# Its API, the worker that runs its jobs and the scheduler that queues
# the recurring ones, all from its backend image; the live server that
# keeps documents in step between people editing them; and its three
# web apps — the main one, the public "spaces" pages, and the instance
# admin at /god-mode/ — each a server of its own. All on one hostname,
# divided by path; see Plane.network.yaml.
#
# The API runs the migrations, in an init container, and then claims
# the instance for its administrator. The worker and the scheduler
# wait for the migrations themselves. The scheduler is replaced rather
# than rolled, since two would queue every recurring job twice.
apiVersion: v1
kind: Service
metadata:
  name: plane-api
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  selector:
    app: plane
    role: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: plane-live
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  selector:
    app: plane
    role: live
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: plane-web
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  selector:
    app: plane
    role: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: plane-space
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  selector:
    app: plane
    role: space
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: plane-admin
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  selector:

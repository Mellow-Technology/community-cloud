# Lago's configuration, for its API, worker and clock, and for the web
# app in front of them.
#
# Everything here is safe to read. The secrets — the database and
# Redis passwords, the keys Rails signs and encrypts with, the key
# sessions are signed with and the first account's password — are
# generated by the installer and handed to the containers from their
# own Secrets in Lago.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lago
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
data:
  RAILS_ENV: "production"
  RAILS_LOG_TO_STDOUT: "true"

  # Two hostnames: the web app, and the API it and everything else
  # talks to. Links to PDFs are made from the API's, and the API only
  # answers browsers from the web app's.
  LAGO_API_URL: {{ printf "https://%s" .Values.domain.billingApi | quote }}
  LAGO_FRONT_URL: {{ printf "https://%s" .Values.domain.billing | quote }}

  # The job queues and the cache, each in a database of the shared
  # Redis of its own. Twenty, when it's there, uses the first.
  REDIS_URL: "redis://redis:6379/1"
  LAGO_REDIS_CACHE_URL: "redis://redis:6379/2"

  # Rendered by Gotenberg, from Lago.pdf.yaml
  LAGO_PDF_URL: "http://lago-pdf"

  # Its files — invoices, credit notes and receipts as PDFs, data
  # exports, uploaded logos — are kept in its own bucket in the
  # cluster's SeaweedFS, from Lago.bucket.yaml. Setting an endpoint is
  # what makes Lago treat this as S3 that isn't Amazon's, and SeaweedFS
  # wants the bucket in the path rather than the hostname. It takes
  # whatever region a request is signed for.
  LAGO_USE_AWS_S3: "true"
  LAGO_AWS_S3_ENDPOINT: {{ .Values.objectStorage.endpoint | quote }}
  LAGO_AWS_S3_BUCKET: "lago"
  LAGO_AWS_S3_REGION: {{ .Values.objectStorage.region | quote }}
  LAGO_AWS_S3_PATH_STYLE: "true"
  LAGO_USE_GCS: "false"

  # Nobody signs up. The first account is made on first start, with the
  # cluster's admin address, and everyone else is invited from inside
  # Lago. Lago has no OpenID Connect, so this is its own sign in rather
  # than Authentik's.
  LAGO_DISABLE_SIGNUP: "true"
  LAGO_ORG_NAME: "Community Cloud"
  LAGO_ORG_USER_EMAIL: {{ .Values.adminEmail | quote }}

  # Sidekiq's dashboard is mounted on the API with no sign in in front
  # of it, and the API is public
  LAGO_SIDEKIQ_WEB: "false"

  # Community Cloud aims for privacy by default
  LAGO_DISABLE_SEGMENT: "true"

  # Webhooks go to the outside world only, so one can't be pointed at
  # something inside the cluster
  LAGO_WEBHOOK_ALLOW_PRIVATE_URLS: "false"

  # How Lago connects integrations like Google sign in and accounting
  # tools: through a proxy the project runs, and only when one is set
  # up in Lago's settings
  LAGO_OAUTH_PROXY_URL: "https://proxy.getlago.com"

  # Mail goes through the cluster's mail server, from "smtp" in the
  # configuration. The username and password come from the cc-smtp
  # Secret, in Lago.yaml; with no username Rails doesn't log in. With
  # no mail server nothing is sent. Rails can only upgrade a connection
  # with STARTTLS, never start one with TLS, which preflight checks.
{{ if .Values.mail.enabled }}
  LAGO_SMTP_ADDRESS: {{ .Values.mail.host | quote }}
  LAGO_SMTP_PORT: {{ .Values.mail.port | quote }}
  LAGO_SMTP_DOMAIN: {{ .Values.mail.fromDomain | quote }}
  LAGO_SMTP_ENABLE_STARTTLS_AUTO: {{ .Values.mail.startTls | quote }}
{{ end }}
  LAGO_FROM_EMAIL: {{ printf "billing@%s" .Values.mail.fromDomain | quote }}
---
# Rails code of ours, loaded with Lago's own initializers.
#
# Links to Lago's files are to its API, which by default answers them
# by redirecting to a link signed for the bucket itself — at the
# address Lago reaches SeaweedFS on, inside the cluster, so whoever
# followed it, a customer opening an invoice, would get nowhere.
# Proxying has the API fetch the file from the bucket and send it on,
# so a link to an invoice is only ever a link to Lago. Lago has no setting for it; Rails reads this one
# once everything here has run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lago-initializers
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
data:
  community_cloud.rb: |
    Rails.application.config.active_storage.resolve_model_to_route = :rails_storage_proxy
---
# The web app is static files, told where the API is when it starts
apiVersion: v1
kind: ConfigMap
metadata:
  name: lago-front
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
data:
  API_URL: {{ printf "https://%s" .Values.domain.billingApi | quote }}
  APP_ENV: "production"
  LAGO_DISABLE_SIGNUP: "true"
  LAGO_OAUTH_PROXY_URL: "https://proxy.getlago.com"
  LAGO_DISABLE_PDF_GENERATION: "false"

# Lago
#
# Three Deployments from the one image: the API, the worker that runs
# its jobs, and the clock that queues the recurring ones — billing
# runs, invoice finalisation, usage refreshes. Its files are in a
# bucket, so none of them keeps anything on a disk of its own, and the
# API and the worker roll like anything else. The clock is the
# exception: there must only ever be one, since two would queue every
# billing run twice, so it's replaced rather than rolled.
#
# The API runs the migrations, in an init container, so nothing starts
# against a database it doesn't match. The others wait for them.
apiVersion: v1
kind: Service
metadata:
  name: lago
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  selector:
    app: lago
    role: server
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lago
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: lago
      role: server
  template:
    metadata:
      labels:
        app: lago
        role: server
        app.kubernetes.io/managed-by: "community-cloud"
      annotations:
        # Changes when the mail server does, so the pod is replaced and
        # starts with the new one. Nothing restarts it for a changed
        # ConfigMap or Secret otherwise.
        community-cloud/smtp: {{ .Values.mail.revision | quote }}
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      securityContext:
        # The image runs as "nonroot", which has to be able to read the
        # key sessions are signed with. It belongs to this group.
        fsGroup: 65532
      initContainers:
        - name: migrate
          image: getlago/api:v1.55.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          # The image's own migrations, then the first account. Lago's
          # task for that finds the organisation by name and the
          # account by address, so run again after either was changed
          # in Lago it would make a second of each — it's only run on
          # a database with no organisation in it yet.
          args:
            - |
              set -e
              ./scripts/migrate.sh
              if ! bundle exec rails runner 'exit(Organization.exists?)'
              then
                LAGO_CREATE_ORG=true bundle exec rails signup:seed_organization
              fi
          envFrom:
            - configMapRef:
                name: lago
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: lago-db
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: lago-db
                  key: password
            # The generated password is words and hyphens, so it goes
            # into a URL as it is
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@cc-postgres-rw:5432/lago"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-redis
                  key: password
            - name: LAGO_REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-redis
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: lago-secret-key-base
                  key: password
            - name: LAGO_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-primary
                  key: password
            - name: LAGO_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-deterministic
                  key: password
            - name: LAGO_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-salt
                  key: password
            # Only read when the first account is made. After that it's
            # in the database, and this is where to find what it was
            # set to.
            - name: LAGO_ORG_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lago-admin
                  key: password
          volumeMounts:
            - name: rsa
              mountPath: /app/config/keys
              readOnly: true
            - name: initializers
              mountPath: /app/config/initializers/community_cloud.rb
              subPath: community_cloud.rb
              readOnly: true
      containers:
        - name: api
          image: getlago/api:v1.55.0
          imagePullPolicy: IfNotPresent
          command: ["./scripts/start.api.sh"]
          envFrom:
            - configMapRef:
                name: lago
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: lago-db
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: lago-db
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@cc-postgres-rw:5432/lago"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-redis
                  key: password
            - name: LAGO_REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-redis
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: lago-secret-key-base
                  key: password
            - name: LAGO_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-primary
                  key: password
            - name: LAGO_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-deterministic
                  key: password
            - name: LAGO_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-salt
                  key: password
            # The bucket's keys, which the SeaweedFS operator made and
            # wrote here; see Lago.bucket.yaml
            - name: LAGO_AWS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lago-s3
                  key: accessKey
            - name: LAGO_AWS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lago-s3
                  key: secretKey
            # Optional, so a cluster without a mail server, and so
            # without the Secret, still starts
            - name: LAGO_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cc-smtp
                  key: username
                  optional: true
            - name: LAGO_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-smtp
                  key: password
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: 250m
          volumeMounts:
            - name: rsa
              mountPath: /app/config/keys
              readOnly: true
            - name: initializers
              mountPath: /app/config/initializers/community_cloud.rb
              subPath: community_cloud.rb
              readOnly: true
      volumes:
        # Only the key, under the name Lago looks for it by. Lago reads
        # this file in preference to its environment, so the key is
        # never in one.
        - name: rsa
          secret:
            secretName: lago-rsa
            defaultMode: 0440
            items:
              - key: privateKey
                path: private.pem
        # Lago.config.yaml says why
        - name: initializers
          configMap:
            name: lago-initializers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lago-worker
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: lago
      role: worker
  template:
    metadata:
      labels:
        app: lago
        role: worker
        app.kubernetes.io/managed-by: "community-cloud"
      annotations:
        # Changes when the mail server does, so the pod is replaced and
        # starts with the new one. Nothing restarts it for a changed
        # ConfigMap or Secret otherwise.
        community-cloud/smtp: {{ .Values.mail.revision | quote }}
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      securityContext:
        # The image runs as "nonroot", which has to be able to read the
        # key sessions are signed with. It belongs to this group.
        fsGroup: 65532
      initContainers:
        # Not until the API's migrations have run, so nothing works
        # against a database it doesn't match. Lago asks this of itself
        # the same way, in its diagnostics.
        - name: wait-for-migrations
          image: getlago/api:v1.55.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              until bundle exec rails runner 'exit(!ApplicationRecord.connection_pool.migration_context.needs_migration?)'
              do
                echo "Waiting for Lago's migrations"
                sleep 10
              done
          envFrom:
            - configMapRef:
                name: lago
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: lago-db
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: lago-db
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@cc-postgres-rw:5432/lago"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-redis
                  key: password
            - name: LAGO_REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-redis
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: lago-secret-key-base
                  key: password
            - name: LAGO_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-primary
                  key: password
            - name: LAGO_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-deterministic
                  key: password
            - name: LAGO_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-salt
                  key: password
          volumeMounts:
            - name: rsa
              mountPath: /app/config/keys
              readOnly: true
            - name: initializers
              mountPath: /app/config/initializers/community_cloud.rb
              subPath: community_cloud.rb
              readOnly: true
      containers:
        - name: worker
          image: getlago/api:v1.55.0
          imagePullPolicy: IfNotPresent
          command: ["./scripts/start.worker.sh"]
          envFrom:
            - configMapRef:
                name: lago
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: lago-db
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: lago-db
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@cc-postgres-rw:5432/lago"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-redis
                  key: password
            - name: LAGO_REDIS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-redis
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: lago-secret-key-base
                  key: password
            - name: LAGO_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-primary
                  key: password
            - name: LAGO_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-deterministic
                  key: password
            - name: LAGO_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: lago-encryption-salt
                  key: password
            # The bucket's keys, which the SeaweedFS operator made and
            # wrote here; see Lago.bucket.yaml
            - name: LAGO_AWS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lago-s3
                  key: accessKey
            - name: LAGO_AWS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lago-s3
                  key: secretKey
            # The worker is what sends the mail
            - name: LAGO_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cc-smtp
                  key: username
                  optional: true
            - name: LAGO_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-smtp
                  key: password
                  optional: true
          # Sidekiq answers here for as long as it's alive
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: 250m
          volumeMounts:
            - name: rsa
              mountPath: /app/config/keys
              readOnly: true
            - name: initializers
              mountPath: /app/config/initializers/community_cloud.rb
              subPath: community_cloud.rb
              readOnly: true
      volumes:
        # Only the key, under the name Lago looks for it by. Lago reads
        # this file in preference to its environment, so the key is
        # never in one.
        - name: rsa
          secret:
            secretName: lago-rsa
            defaultMode: 0440
            items:
              - key: privateKey
                path: private.pem
        # Lago.config.yaml says why
        - name: initializers
          configMap:
            name: lago-initializers

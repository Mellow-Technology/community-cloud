apiVersion: v1
kind: Service
metadata:
    name: twenty-crm
    namespace: cc-office
spec:
    selector:
        app: twenty-crm
        role: server
    ports:
        - protocol: TCP
          port: 8000
          targetPort: 3000
    sessionAffinity: ClientIP
    sessionAffinityConfig:
        clientIP:
            timeoutSeconds: 10800
    type: ClusterIP
---
# Twenty Uses a Servers and workers setup
# We setup deployments for each one.
# We use 2 replicas for the front-end
apiVersion: apps/v1
kind: Deployment
metadata:
    name: twenty-crm
    namespace: cc-office
spec:
    replicas: 1
    selector:
        matchLabels:
            app: twenty-crm
            role: server
    template:
        metadata:
            labels:
                app: twenty-crm
                role: server
        spec:
            nodeSelector:
                node-role.kubernetes.io/worker: worker
            containers:
                - name: twenty-crm
                  image: twentycrm/twenty:v2.7.3
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: DISABLE_DB_MIGRATIONS
                        value: "true"
                      - name: SERVER_URL
                        valueFrom:
                            configMapKeyRef:
                                name: twenty-crm
                                key: server_url
                      - name: ENCRYPTION_KEY
                        valueFrom:
                            secretKeyRef:
                                name: twenty-crm
                                key: encryptionKey
                      - name: DB_USER
                        valueFrom:
                            secretKeyRef:
                                name: twenty-crm
                                key: username
                      - name: DB_PASS
                        valueFrom:
                            secretKeyRef:
                                name: twenty-crm
                                key: password
                      - name: DB_HOST
                        valueFrom:
                            secretKeyRef:
                                name: cc-postgres-app
                                key: host
                      - name: DB_PORT
                        valueFrom:
                            secretKeyRef:
                                name: cc-postgres-app
                                key: port
                      # Note here that the database name is hard-coded
                      # to "twenty_crm". There should be no need to change this
                      - name: PG_DATABASE_URL
                        value: "postgres://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/twenty_crm"
                      - name: REDIS_URL
                        value: "redis://$(REDIS_SERVICE_HOST):$(REDIS_SERVICE_PORT)/0"
                      - name: STORAGE_TYPE
                        value: S_3
                      - name: BUCKET_HOST
                        valueFrom:
                            configMapKeyRef:
                                name: twenty-crm-bucket
                                key: BUCKET_HOST
                      - name: STORAGE_S3_ENDPOINT
                        value: "http://$(BUCKET_HOST):80"
                      # Garage uses this region
                      - name: STORAGE_S3_REGION
                        value: "garage"
                      - name: STORAGE_S3_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: twenty-crm-bucket
                                key: BUCKET_NAME
                      - name: STORAGE_S3_ACCESS_KEY_ID
                        valueFrom:
                            secretKeyRef:
                                name: twenty-crm-bucket
                                key: AWS_ACCESS_KEY_ID
                      - name: STORAGE_S3_SECRET_ACCESS_KEY
                        valueFrom:
                            secretKeyRef:
                                name: twenty-crm-bucket
                                key: AWS_SECRET_ACCESS_KEY
                  ports:
                      - containerPort: 3000
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: 1
---
# TODO: Add horizontal pod autoscaler
# for worker pods
apiVersion: apps/v1
kind: Deployment
metadata:
    name: twenty-crm-workers
    namespace: cc-office
spec:
    replicas: 1
    selector:
        matchLabels:
            app: twenty-crm
            role: worker
    template:
        metadata:
            labels:
                app: twenty-crm
                role: worker
        spec:
            nodeSelector:
                node-role.kubernetes.io/worker: worker
            containers:
                - name: twenty-crm
                  image: twentycrm/twenty:v2.7.3
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: DISABLE_DB_MIGRATIONS
                        value: "true"
                      - name: DB_USER
                        valueFrom:
                            secretKeyRef:
                                name: twenty-crm
                                key: username
                      - name: DB_PASS
                        valueFrom:
                            secretKeyRef:
                                name: twenty-crm
                                key: password
                      - name: DB_HOST
                        valueFrom:
                            secretKeyRef:
                                name: cc-postgres-app
                                key: host
                      - name: DB_PORT
                        valueFrom:
                            secretKeyRef:
                                name: cc-postgres-app
                                key: port
                      - name: PG_DATABASE_URL
                        value: "postgres://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/twenty_crm"
                      - name: REDIS_URL
                        value: "redis://$(REDIS_SERVICE_HOST):$(REDIS_SERVICE_PORT)/0"
                      - name: STORAGE_TYPE
                        value: S_3
                      - name: BUCKET_HOST
                        valueFrom:
                            configMapKeyRef:
                                name: twenty-crm-bucket
                                key: BUCKET_HOST
                      - name: STORAGE_S3_ENDPOINT
                        value: "http://$(BUCKET_HOST):80"
                      # Garage uses this region
                      - name: STORAGE_S3_REGION
                        value: "garage"
                      - name: STORAGE_S3_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: twenty-crm-bucket
                                key: BUCKET_NAME
                      - name: STORAGE_S3_ACCESS_KEY_ID
                        valueFrom:
                            secretKeyRef:
                                name: twenty-crm-bucket
                                key: AWS_ACCESS_KEY_ID
                      - name: STORAGE_S3_SECRET_ACCESS_KEY
                        valueFrom:
                            secretKeyRef:
                                name: twenty-crm-bucket
                                key: AWS_SECRET_ACCESS_KEY
                  command:
                      - yarn
                      - worker:prod
                  resources:
                      requests:
                          memory: "512Mi"
                          cpu: 1

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: picoclaw
  namespace: cc-office
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  parentRefs:
    - name: cc-office-web-gateway
  hostnames:
    - {{ .Values.domain.agent }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: picoclaw
          port: 8000

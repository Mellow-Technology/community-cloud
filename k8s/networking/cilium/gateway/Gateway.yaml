# The cluster Gateway, in community-cloud, whose namespace is
# Gateway.namespace.yaml. Applications attach their own listeners from
# their own namespaces, with ListenerSets.
#
# The default Gateway for applications
# deployed to Community Cloud
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # Out of the box we provide
  # Let's Encrypt integration
  name: cc-letsencrypt-web-gateway
  namespace: community-cloud
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  # We use the default Cilium gateway
  gatewayClassName: cilium
  # The addresses to listen on: every gateway address in the
  # configuration that is a single address, from gatewayAddresses (see
  # installer/src/util/gateway.ts). Each has to be in Cilium's pool,
  # which the gateway bundle makes from the same list, or Cilium marks
  # the Gateway as not programmed. With none, Cilium picks one from
  # the pool.
{{ if .Values.gatewayAddresses }}
  addresses:
{{ range .Values.gatewayAddresses }}
    - type: IPAddress
      value: "{{ . }}"
{{ end }}
{{ end }}
  # A Gateway has to have a listener of its own. This one matches no
  # real hostname; everything served is on a ListenerSet's.
  listeners:
    - name: example-http
      port: 80
      protocol: HTTP
      hostname:  example
  # We allow listeners from the label
  # whereWereGoing=weDontNeedRoads
  # on the namespace. This allows some
  # default control at the cluster level
  # if there's a desire to prevent ingress/egress
  # outside of the cluster.
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          whereWereGoing: weDontNeedRoads

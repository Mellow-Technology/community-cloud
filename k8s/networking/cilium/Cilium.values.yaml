k8sServiceHost: {{ .Values.k8sApiServer }}  # The Kubernetes API server address
k8sServicePort: {{ .Values.k8sApiPort | default "6443" }}  # Kubernetes API server port
kubeProxyReplacement: true  # Enables eBPF-based kube-proxy replacement for better performance

# Set the routing mode and tunnel protocol
# These are currently the defaults, however
# we want to set them explicitly
routingMode: "tunnel"
tunnelProtocol: "vxlan"

# The MTU of the network under Cilium: the Nebula mesh between nodes,
# 1300 (Defined Networking's default), unless network.meshMtu says
# otherwise. Cilium takes VXLAN's 50 bytes off it for pods, so their
# routes are 1250 and a full pod packet fits the mesh once wrapped.
#
# It's said rather than left to Cilium, which detects it as the
# smallest MTU among the devices above when an agent starts. An agent
# that starts before the mesh's interface is up sees only 1500-byte
# network cards and keeps 1500, so a full pod packet becomes 1550 in a
# 1300-byte tunnel, to be fragmented, or dropped where it can't be.
#
# Capitals: the chart's key is MTU, and it ignores "mtu". Pods take a
# new value when they're next created.
MTU: {{ .Values.meshMtu }}

# The devices the eBPF datapath attaches to: every interface
# Community Cloud treats as carrying traffic between nodes,
# which is the wired and wireless ones plus the mesh tunnels.
# The list is installer/src/util/interfaces.ts, so that this
# and the gateway's ARP announcements can't drift apart.
devices: {{ .Values.networkDevices | quote }}

bpf:
  masquerade: true
externalIPs:
  enabled: true  # Allows services to use external IPs for better connectivity
k8sClientRateLimit:
  qps: 200  # API request rate limit to avoid overwhelming the K8s API
  burst: 600  # Maximum burst rate for API requests
operator:
  replicas: 1  # Ensures a single replica of the Cilium operator, suitable for small clusters
  # Restart the operator when the configuration it reads changes, as
  # rollOutCiliumPods below does for the agents
  rollOutPods: true
  prometheus:
    enabled: true
  dashboards:
    enabled: true

# Metrics, for the monitoring package's PodMonitors, and Cilium's
# Grafana dashboards, as ConfigMaps Grafana finds by their label. The
# PodMonitors aren't asked for here because this chart goes first,
# long before the resource type they're written in exists.
#
# These listen on 9962 and 9963 on every interface of every node: the
# pods share the node's network, and this chart writes the one address
# for every node into a ConfigMap. Hubble's metrics stay off, since
# they label traffic by what it's going between.
prometheus:
  enabled: true
dashboards:
  enabled: true

# Restart the agents when the configuration changes. Otherwise a
# changed setting, the MTU say, waits for each agent's next restart.
# The pod template carries a checksum of the cilium-config ConfigMap,
# so an upgrade that changes nothing restarts nothing. They roll two
# nodes at a time (the chart's maxUnavailable).
rollOutCiliumPods: true

# Use Gateway API as it's the future
gatewayAPI:
  enabled: true

# Answer for load balancer addresses on the LAN with ARP.
# Needed when a router forwards ports to an address nothing
# is holding, which is the "port-forward" gateway mode. In
# the "floating" mode the node already holds the address,
# so nothing has to announce it.
#
# k8sClientRateLimit above is sized for this: announcing
# uses a lease per service, and the defaults of 5 and 10
# are far too low to renew them.
l2announcements:
  enabled: {{ .Values.l2Announcements }}

# Envoy is used for L7 routing
# We use in standalone mode so it can be
# operated independently of Cilium
envoy:
  enabled: true
  useOriginalSourceAddress: false
  # Nothing scrapes it, and it's on by default, on 9964 on every
  # interface of every node, with no setting for the address
  prometheus:
    enabled: false
  securityContext:
    capabilities:
      # Allow for port binding
      keepCapNetBindService: true
      envoy:
        - NET_BIND_SERVICE
        - NET_ADMIN
        - SYS_ADMIN
        - BPF
# Enable Hubble
hubble:
  enabled: true
  ui:
    enabled: true
  relay:
    enabled: true
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: "10.42.0.0/16"

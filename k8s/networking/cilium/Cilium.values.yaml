k8sServiceHost: {{ .Values.k8sApiServer }}  # The Kubernetes API server address
k8sServicePort: {{ .Values.k8sApiPort | default "6443" }}  # Kubernetes API server port
kubeProxyReplacement: true  # Enables eBPF-based kube-proxy replacement for better performance

# Set the routing mode and tunnel protocol
# These are currently the defaults, however
# we want to set them explicitly
routingMode: "tunnel"
tunnelProtocol: "vxlan"

# The devices the eBPF datapath attaches to: every interface
# Community Cloud treats as carrying traffic between nodes,
# which is the wired and wireless ones plus the mesh tunnels.
# The list is installer/src/util/interfaces.ts, so that this
# and the gateway's ARP announcements can't drift apart.
devices: {{ .Values.networkDevices | quote }}

bpf:
  masquerade: true
externalIPs:
  enabled: true  # Allows services to use external IPs for better connectivity
k8sClientRateLimit:
  qps: 200  # API request rate limit to avoid overwhelming the K8s API
  burst: 600  # Maximum burst rate for API requests
operator:
  replicas: 1  # Ensures a single replica of the Cilium operator, suitable for small clusters

# Ensures smooth rolling updates of Cilium components
# Ensures that Cilium pods are updated properly during upgrades
rollOutPods: true
rollOutCiliumPods: true

# Use Gateway API as it's the future
gatewayAPI:
  enabled: true

# Answer for load balancer addresses on the LAN with ARP.
# Needed when a router forwards ports to an address nothing
# is holding, which is the "port-forward" gateway mode. In
# the "floating" mode the node already holds the address,
# so nothing has to announce it.
#
# k8sClientRateLimit above is sized for this: announcing
# uses a lease per service, and the defaults of 5 and 10
# are far too low to renew them.
l2announcements:
  enabled: {{ .Values.l2Announcements }}

# Envoy is used for L7 routing
# We use in standalone mode so it can be
# operated independently of Cilium
envoy:
  enabled: true
  useOriginalSourceAddress: false
  securityContext:
    capabilities:
      # Allow for port binding
      keepCapNetBindService: true
      envoy:
        - NET_BIND_SERVICE
        - NET_ADMIN
        - SYS_ADMIN
        - BPF
# Enable Hubble
hubble:
  enabled: true
  ui:
    enabled: true
  relay:
    enabled: true
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: "10.42.0.0/16"

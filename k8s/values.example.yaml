# values.example.yaml — the values the templates under k8s/ read
#
# The real values come from cc.config.json: its "values" section, with
# the rest of the configuration underneath and some values derived by
# the installer. This file only shows their shape; nothing reads it.
# See installer/README.md, under "values".
#
# To see a template rendered against a configuration, without applying
# it:
#
#   community-cloud run-template embed://<path> cc.config.json --dry-run

# -------------------------------------------------------------------
# Administration
# -------------------------------------------------------------------
adminEmail: "admin@example.com"

# The Authentik group whose members are cluster admins, through Headlamp
# or kubectl. Has to start "k8s-", since only those groups may sign in
# to the cluster. Defaults to "k8s-admins".
clusterAdminGroup: "k8s-admins"

# -------------------------------------------------------------------
# Domains
# -------------------------------------------------------------------
domain:
  # Primary domain used for all Community Cloud services.
  # Subdomains are derived automatically (storage.<main>, auth.<main>, etc.)
  main: "my-community-cloud.example.com"
  # Secondary domain (optional, for Bright Blue or other services)
  secondary: "secondary.example.com"
  # CRM (Twenty) hostname — can be on a different domain
  crm: "crm.example.com"
  # Mattermost hostname
  mattermost: "chat.example.com"
  # Authentik hostname (derived: auth.<main>)
  auth: "auth.example.com"
  # Picoclaw agent hostname (derived: agent.<main>)
  agent: "agent.example.com"
  # Lago's web app and its API (derived: billing.<main>, billing-api.<main>)
  billing: "billing.example.com"
  billingApi: "billing-api.example.com"
  # Documenso hostname (derived: sign.<main>)
  signing: "sign.example.com"
  # Plane hostname (derived: plane.<main>)
  plane: "plane.example.com"
  # Headlamp, signed into through Authentik (derived: headlamp.<main>)
  headlamp: "headlamp.example.com"
  # SeaweedFS's S3, for links to files in buckets (derived: s3.<main>)
  storage: "s3.example.com"
  # ProjectSend, for sharing files with clients (derived: files.<main>)
  files: "files.example.com"

# Where ProjectSend keeps the files people share: "local", a volume on a
# node's disks, or "s3", a bucket in SeaweedFS. Chosen once.
projectsend:
  storage: "local"

# -------------------------------------------------------------------
# Storage
# -------------------------------------------------------------------
# How much disk the database and SeaweedFS claim isn't set here. It's
# "storage.allocations" in the installer configuration, which hands
# each manifest its size as databaseVolumeSize and
# objectStorageVolumeSize. See k8s/storage/README.md.


# -------------------------------------------------------------------
# Container Registry
# -------------------------------------------------------------------
registry:
  url: "registry.example.com"
  username: "my-registry-user"
  password: "CHANGE_ME"

# -------------------------------------------------------------------
# Tailscale
# -------------------------------------------------------------------
tailscale:
  clientID: "CHANGE_ME"
  clientSecret: "CHANGE_ME"

# -------------------------------------------------------------------
# Authentik
# -------------------------------------------------------------------
authentik:
  # Generate a strong secret key:
  #   openssl rand -base64 64
  secretKey: "CHANGE_ME_GENERATE_A_STRONG_SECRET_KEY"

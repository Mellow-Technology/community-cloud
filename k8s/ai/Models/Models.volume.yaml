# Where the model servers in Models.yaml keep the weights they download,
# so a restart, or a model being swapped back in, doesn't fetch them
# again. On the node-local SSD class, which ties the Deployment to the
# node it's first scheduled on: the one with a card.
#
# Sized for a handful of quantised models. A 120B MoE at 4 bits is
# about 65 GB on its own, so grow it before adding more of those.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: cc-ai
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 250Gi
  storageClassName: cc-local-ssd-fast
  volumeMode: Filesystem

# vLLM serving Mistral-7B on an AMD GPU, through ROCm. Applied by hand,
# after vllm-amd-pvc.yaml, with run-template. It needs the amd bundle to
# have run, so the cluster has "amd.com/gpu" to give it, and a Secret
# "hf-token-secret" in cc-office with a Hugging Face token under
# "token": Mistral's models ask you to accept their terms first.
#
# Written for a Ryzen AI Max ("Strix Halo", gfx1151), an APU: one GPU
# with no memory of its own, using the node's RAM. The image is AMD's,
# built for every RDNA and Instinct target including gfx1151, on ROCm
# 10.1, which AMD list as stable for it. It carries its own amd-smi, as
# vLLM needs one that knows gfx1151.
#
# The card comes from the device plugin, which passes /dev/kfd and the
# card's /dev/dri nodes into the pod, so it needs neither the host's
# network nor its IPC namespace, and isn't privileged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistral-7b
  namespace: cc-office
  labels:
    app: mistral-7b
spec:
  replicas: 1
  # One GPU and a volume on one node: the old pod has to let go of both
  # before a new one can start
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mistral-7b
  template:
    metadata:
      labels:
        app: mistral-7b
    spec:
      volumes:
        # PyTorch passes tensors between vLLM's processes through
        # /dev/shm, which is 64MB unless something bigger is mounted.
        # This is what host IPC was standing in for.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"
        - name: models
          persistentVolumeClaim:
            claimName: mistral-7b
      containers:
        - name: mistral-7b
          # Tag and digest, so the image can't change under the tag
          image: rocm/vllm:rocm10.1.0_ubuntu24.04_py3.14-pytorch_2.13.0_vllm-0.29.0@sha256:e0ea9a10b729573ea8598bdc073bda0ea382fe1037eec7c0761b6fa7f46baaf4
          # As AMD's own instructions for these images have it. Neither
          # has been tried without on this cluster.
          securityContext:
            seccompProfile:
              type: Unconfined
            runAsGroup: 44
            capabilities:
              add:
                - SYS_PTRACE
          command: ["/bin/sh", "-c"]
          # bfloat16, since gfx1151 has no FP8. vLLM takes a share of
          # whatever the GPU reports as its memory for the model and
          # its cache: today that's what the BIOS sets aside, and once
          # the node uses GTT instead (see "AMD GPUs" in the installer's
          # README) it's ttm.pages_limit. A third of 96 GiB is about 32
          # GiB: 14.5 GiB of weights and the rest for the cache, which
          # an 8192 token context fills comfortably.
          args:
            [
              "vllm serve mistralai/Mistral-7B-v0.3 --port 8888 --dtype bfloat16 --max-model-len 8192 --gpu-memory-utilization 0.33",
            ]
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
            # Hugging Face's cache, on the volume
            - name: HF_HOME
              value: /models
          ports:
            - containerPort: 8888
          # Sized for the process alone, which is right while the GPU's
          # memory is set aside by the BIOS and isn't RAM Kubernetes
          # can see.
          #
          # Once the GPU borrows RAM through GTT, what it borrows comes
          # out of the RAM Kubernetes schedules pods into, and nothing
          # counts it against this pod. Then raise the request by what
          # vLLM will take (about 32Gi with the settings above, so 40Gi
          # in all), so the scheduler keeps it free, and raise the limit
          # to match.
          resources:
            limits:
              cpu: "10"
              memory: 20G
              amd.com/gpu: "1"
            requests:
              cpu: "6"
              memory: 8G
              amd.com/gpu: "1"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: models
              mountPath: /models
---
apiVersion: v1
kind: Service
metadata:
  name: mistral-7b
  namespace: cc-office
spec:
  ports:
    - name: http-mistral-7b
      port: 80
      protocol: TCP
      targetPort: 8888
  selector:
    app: mistral-7b
  sessionAffinity: None
  type: ClusterIP

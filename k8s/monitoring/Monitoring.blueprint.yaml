# Grafana's client in Authentik.
#
# Not a Kubernetes manifest. This is an Authentik blueprint, which the
# installer hands to Authentik's worker once the client's credentials
# exist — see installer/src/cli/commands/Authentik.ts. It's rendered as
# a template first, like everything else in k8s/, and the client ID and
# secret arrive separately through "!Context" so they're never written
# into it.
#
# Every entry is found by its identifiers and made to match, so this
# can be applied as often as the install is run.
version: 1
metadata:
  name: Community Cloud - Grafana
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Grafana
    attrs:
      client_type: confidential
      client_id: !Context client_id
      client_secret: !Context client_secret
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Grafana sends people back here, and nowhere else
      redirect_uris:
        - matching_mode: strict
          url: {{ printf "https://%s/login/generic_oauth" .Values.domain.grafana | quote }}
      # Authentik 2026 starts a new provider with no grant types, so
      # each one this client uses is named
      grant_types: [authorization_code]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf provider
      meta_launch_url: {{ printf "https://%s/" .Values.domain.grafana | quote }}
      meta_description: How the cluster is doing
      policy_engine_mode: any

  # The same people as may sign in to the cluster itself (see
  # ClusterSignIn.ts). Grafana shows what's running and where, and
  # someone added to a group to use the CRM shouldn't find they can
  # read that too. The groups are the ones the "profile" scope puts in
  # the token: the person's own, not their parents'.
  - model: authentik_policies_expression.expressionpolicy
    id: cluster-access
    identifiers:
      name: Grafana - in a k8s- group
    attrs:
      expression: |
        return request.user.groups.filter(name__startswith="k8s-").exists()

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      policy: !KeyOf cluster-access
    attrs:
      order: 0

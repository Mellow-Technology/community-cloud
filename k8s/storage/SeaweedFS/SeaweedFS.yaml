# SeaweedFS: S3-compatible object storage for the applications in the
# cluster, run by the SeaweedFS operator.
#
# By default the smallest cluster the operator makes: one master, one
# volume server, one filer and one S3 gateway, keeping one copy of
# everything. That is a single point of failure on purpose: it's where
# most clusters start, and it's simple enough to be sure of before
# anything is spread across machines. "storage.objectStorage" in the
# configuration asks for more masters, more volume servers, and more
# copies, which are kept on different volume servers on different
# nodes; see installer/src/util/objectStorage.ts.
#
# Every volume is local SSD, through TopoLVM, for the same reason the
# database is. A claim on local storage pins its pod to the node it was
# made on, so the nodeSelector is also where these will stay.
#
# Applications don't use the cluster's own keys. Each asks for a
# bucket, and keys to only that bucket, with the operator's Bucket,
# S3Identity and S3Credentials in its own namespace; the operator
# writes the keys into a Secret beside it. See k8s/apps/lago/
# Lago.bucket.yaml.
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: seaweed
  namespace: seaweedfs
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  # The operator doesn't choose one, and its samples float on
  # "latest". This is the release the SeaweedFS chart of the same
  # version ships.
  image: chrislusf/seaweedfs:4.48

  # Where TopoLVM can provide the volumes
  nodeSelector:
    node-role.kubernetes.io/storage-local: storage-local

  volumeServerDiskCount: 1

  master:
    replicas: {{ .Values.objectStorageShape.masters }}

    # How many copies of everything: none in another data center or
    # another rack, and the rest on other servers in this one
    defaultReplication: {{ .Values.objectStorageShape.replication | quote }}

    # Spread out where there are nodes enough, so losing one doesn't
    # take a majority of the masters with it
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: master
                  app.kubernetes.io/instance: seaweed

    # The size a volume file is allowed to grow to, not the size of
    # anything on disk. The volume server works out how many it has
    # room for from its disk, and every bucket is a collection of
    # volumes of its own, so at the default 30 GB a 50 GiB disk would
    # have room for one bucket.
    volumeSizeLimitMB: 1024

    # How many volume files a bucket is given at a time when it needs
    # more. Seven by default, which with one copy of everything is room
    # for about seven buckets on a 50 GiB disk before any of them has
    # written a byte. The same for two and three copies.
    config: |
      [master.volume_growth]
      copy_1 = 2
      copy_2 = 2
      copy_3 = 2

    # Where the master keeps the cluster's identity and which volume
    # numbers it has handed out. Without it each restart begins again.
    # Can't be added later without recreating the master, so it's here
    # from the start.
    persistence:
      enabled: true
      storageClassName: cc-local-ssd-fast
      resources:
        requests:
          storage: 1Gi

    requests:
      cpu: 50m
      memory: 128Mi

  volume:
    replicas: {{ .Values.objectStorageShape.volumeServers }}
    storageClassName: cc-local-ssd-fast

    # One to a node. Two copies of something on one node's disk are one
    # copy as far as losing that node goes, and SeaweedFS can't tell.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: volume
                app.kubernetes.io/instance: seaweed

    # The data, sized from "storage.allocations.objectStorageGb" in the
    # configuration. The class allows expansion, so this can be raised
    # later and the claim grows with it. It can't be lowered.
    requests:
      storage: {{ .Values.objectStorageVolumeSize }}
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

  filer:
    replicas: 1

    # The names of everything stored, which buckets there are, and the
    # identities and keys applications sign in with. Kept on the
    # filer's own disk, which is why there's one filer: a second would
    # have a different disk and a different idea of what exists.
    config: |
      [leveldb2]
      enabled = true
      dir = "/data/filerldb2"

    persistence:
      enabled: true
      storageClassName: cc-local-ssd-fast
      resources:
        requests:
          storage: 5Gi

    requests:
      cpu: 100m
      memory: 256Mi

  # S3, as "seaweed-s3" on port 8333 inside the cluster, and on
  # values.domain.storage outside it, from SeaweedFS.network.yaml.
  # Applications address buckets by path, and any region is accepted.
  s3:
    replicas: 1
    requests:
      cpu: 50m
      memory: 128Mi
---
# Which namespaces may keep buckets here: those carrying the label.
# Without a grant the operator refuses a Bucket, S3Identity or
# S3Credentials from another namespace, so a namespace has to be let in
# on purpose.
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: buckets
  namespace: seaweedfs
  labels:
    app.kubernetes.io/managed-by: "community-cloud"
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: Bucket
      namespaceSelector:
        matchLabels:
          storage.community-cloud.technology/buckets: "true"
    - group: seaweed.seaweedfs.com
      kind: S3Identity
      namespaceSelector:
        matchLabels:
          storage.community-cloud.technology/buckets: "true"
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespaceSelector:
        matchLabels:
          storage.community-cloud.technology/buckets: "true"
  to:
    - group: seaweed.seaweedfs.com
      kind: Seaweed
      name: seaweed
